name: Build APK

# main에 앱 파일이 바뀌면 안드로이드 APK를 빌드해서 Releases에 올린다.
# 다운로드 주소는 항상 같다: https://github.com/junDevCodes/more/releases/latest/download/more.apk
on:
  push:
    branches: [main]
    paths:
      - "loader/**"
      - "icon-*.png"
      - "assets/**"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 웹 파일 준비
        run: |
          mkdir -p www
          cp loader/index.html www/index.html
          cp icon-*.png www/

      - name: Capacitor 설치
        run: npm install --no-audit --no-fund

      - name: 안드로이드 프로젝트 생성
        run: npx cap add android

      - name: 앱 아이콘
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#111418' --iconBackgroundColorDark '#111418' --splashBackgroundColor '#111418' --splashBackgroundColorDark '#111418'

      - name: 버전 설정
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: 동기화
        run: npx cap sync android

      - name: 빌드
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: 서명
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks signing/more.keystore --ks-key-alias more \
            --ks-pass pass:${{ secrets.MORE_KEYSTORE_PASS || 'moreapp1' }} --key-pass pass:${{ secrets.MORE_KEYSTORE_PASS || 'moreapp1' }} \
            --out more.apk aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify more.apk

      - name: Releases에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MORE 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            폰에서 아래 **more.apk**를 눌러 받은 뒤 설치하세요.
            처음 한 번은 "출처를 알 수 없는 앱 설치"를 허용해야 해요.
            새 버전은 그냥 덮어 설치하면 기록이 그대로 유지돼요.
          files: more.apk
