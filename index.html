<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MORE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
</head><body>
<title>MORE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Black+Han+Sans&display=swap">
<style>
/* Layout: 폰 한 화면 앱. 상단 헤더 + 스크롤 본문 + 하단 고정 탭(오늘/기록/몸/식단). 운동 중엔 탭 대신 하단 액션바. 넓은 화면에선 가운데 480px 기둥. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --ink:#111418; --muted:#5E6673; --faint:#9AA3AE; --line:#E1E4E9; --line2:#EEF0F3;
  --accent:#2F5BEA; --accent-ink:#FFFFFF; --accent-soft:#E6ECFD; --accent-text:#1F44BF;
  --hero:#111418; --hero-2:#23282F; --hero-ink:#FFFFFF; --hero-muted:#B9C0CC;
  --warn:#9A4B00; --warn-soft:#FDF0DC; --c3:#9DB5FF;
  --fig:#111418; --fig-far:#AAB3BE; --eq:#9AA3AE; --eq-fill:#E6E9ED; --pad:#CDD3DA; --floor:#D3D8DF; --muscle:#E0502E; --stage:#F3F4F6;
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"Barlow Condensed","DIN Alternate","Arial Narrow",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1013; --surface:#181B20; --ink:#E9ECF0; --muted:#9AA3AE; --faint:#6B7480; --line:#2A2F37; --line2:#22262D;
  --accent:#5B80FF; --accent-ink:#FFFFFF; --accent-soft:#1D2A52; --accent-text:#A9BEFF;
  --hero:#1F242C; --hero-2:#2A313B; --hero-ink:#FFFFFF; --hero-muted:#B9C0CC;
  --warn:#F2B060; --warn-soft:#33240F; --c3:#7F9BEF;
  --fig:#E9ECF0; --fig-far:#58616D; --eq:#6E7884; --eq-fill:#252A31; --pad:#39414B; --floor:#39414B; --muscle:#FF7A55; --stage:#14171B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1013; --surface:#181B20; --ink:#E9ECF0; --muted:#9AA3AE; --faint:#6B7480; --line:#2A2F37; --line2:#22262D;
  --accent:#5B80FF; --accent-ink:#FFFFFF; --accent-soft:#1D2A52; --accent-text:#A9BEFF;
  --hero:#1F242C; --hero-2:#2A313B; --hero-ink:#FFFFFF; --hero-muted:#B9C0CC;
  --warn:#F2B060; --warn-soft:#33240F; --c3:#7F9BEF;
  --fig:#E9ECF0; --fig-far:#58616D; --eq:#6E7884; --eq-fill:#252A31; --pad:#39414B; --floor:#39414B; --muscle:#FF7A55; --stage:#14171B; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:18px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.top h1{margin:0;font-size:24px;font-weight:700}
.brand{font-family:var(--f-display);font-size:20px;color:var(--accent);letter-spacing:.02em;line-height:1}
.sub{font-size:13px;color:var(--muted)}
.main{flex:1;display:flex;flex-direction:column;gap:12px;padding:4px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{margin:0;font-size:15px;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.num{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.iconbtn.plain{border:0;background:transparent}
.link{border:0;background:transparent;color:var(--accent);font-size:13px;font-weight:600;padding:6px 0}
.btn{height:52px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.sm{height:40px;font-size:14px;border-radius:12px;padding:0 14px}
.btn[disabled]{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);font-weight:600;white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.mute{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5}
.warnbox b{display:block;font-size:12px;margin-bottom:2px}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px}
.hero .hm{color:var(--hero-muted);font-size:13px}
.hero .big{font-family:var(--f-display);font-size:44px;line-height:1;font-weight:400}
.cyc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cyc div{border-radius:12px;background:var(--hero-2);padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:13px;font-weight:600}
.cyc div span{font-size:12px;color:var(--hero-muted);font-weight:500}
.cyc div.on{background:var(--accent)}
.cyc div.on span{color:#DCE5FF}
.hero .btn{background:#FFFFFF;color:#111418}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2);min-width:0}
.list li:last-child{border-bottom:0}
.list .n{font-family:var(--f-num);font-weight:700;color:var(--muted);width:18px;font-size:16px;flex:0 0 auto}
.list .t{flex:1;min-width:0;font-size:15px}
.list .m{font-size:13px;color:var(--muted);white-space:nowrap}
.list button.t{border:0;background:transparent;text-align:left;padding:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;border:0;text-align:left;min-width:0}
.tile .lbl{font-size:13px;color:var(--muted)}
.tile .val{font-family:var(--f-num);font-weight:700;font-size:32px;line-height:1}
.tile .val small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500}
.tile .hint{font-size:12px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.bars i{height:5px;border-radius:3px;background:var(--line)}
.bars i.on{background:var(--accent)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted);font-weight:500}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}

/* workout */
.wtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.seg{display:grid;gap:3px}
.seg i{height:4px;border-radius:2px;background:var(--line)}
.seg i.done{background:var(--accent)}
.seg i.cur{background:var(--ink)}
.exhead{display:flex;gap:12px;align-items:stretch}
.thumb{width:112px;flex:0 0 auto;background:var(--surface);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;padding:6px 4px;color:var(--accent);font-size:12px;font-weight:600}
.thumb svg{width:104px;height:87px}
.target{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px}
.target .w{display:flex;align-items:baseline;justify-content:center;gap:10px;flex-wrap:wrap}
.target .w .num{font-size:60px;line-height:.95}
.target .w .u{font-size:20px;color:var(--hero-muted)}
.target .w .x{font-size:32px;color:#6B7480}
.target .bw{font-size:30px;font-weight:700;text-align:center;line-height:1.2}
.okfail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.okfail button{height:58px;border-radius:14px;font-size:18px;font-weight:700}
.okfail .f{border:1px solid #3A424D;background:transparent;color:#FFFFFF}
.okfail .o{border:0;background:var(--accent);color:#FFFFFF}
.sets{background:var(--surface);border-radius:18px;padding:2px 14px}
.setrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left}
.setrow:last-child{border-bottom:0}
.setrow .sn{font-family:var(--f-num);font-weight:700;font-size:18px;color:var(--muted);width:16px}
.setrow .sw{flex:1;font-family:var(--f-num);font-weight:700;font-size:20px}
.setrow.wait .sw,.setrow.wait .sn{color:var(--faint)}
.setrow.cur .sn{color:var(--accent)}
.res-ok{font-size:13px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:4px}
.res-fail{font-size:13px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:2px 10px}
.wfoot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wfoot .in{max-width:448px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.cardio-pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cardio-pick button{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.cardio-pick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* guide */
.stage{background:var(--stage);border-radius:20px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.stage svg{width:100%;height:auto;aspect-ratio:240/200;display:block}
.phase{display:flex;align-items:center;gap:10px}
.phase .pl{font-size:15px;font-weight:700}
.pbar{height:4px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.5}
.steps li i{width:24px;height:24px;flex:0 0 auto;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);font-family:var(--f-num);font-weight:700;font-style:normal;font-size:15px;display:flex;align-items:center;justify-content:center}
.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.view-note{font-size:12px;color:var(--muted);text-align:center}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:4px;text-align:center}
.cal .h{font-size:12px;color:var(--muted);font-weight:600;padding-bottom:4px}
.cal .d{height:40px;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-weight:600;font-size:17px;border:0;background:transparent;padding:0}
.cal .d span{width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center}
.cal .d.past span{color:var(--faint)}
.cal .d.k1 span{background:var(--ink);color:var(--bg)}
.cal .d.k2 span{background:var(--accent);color:#fff}
.cal .d.k3 span{background:var(--c3);color:#0B1640}
.cal .d.today span{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.cal .d.plan span{border:1.5px dashed var(--c3)}
.legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:5px;display:inline-block}
.sess{background:var(--surface);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;border:0;text-align:left;width:100%}
.datebox{width:42px;height:42px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:0 0 auto}
.datebox b{font-family:var(--f-num);font-size:18px}
.datebox small{font-size:10px}
.k1bg{background:var(--ink);color:var(--bg)}.k2bg{background:var(--accent);color:#fff}.k3bg{background:var(--c3);color:#0B1640}

/* body / diet / settings */
.segctl{display:flex;background:var(--bg);border-radius:10px;padding:3px}
.segctl button{height:30px;padding:0 10px;border-radius:8px;border:0;background:transparent;font-size:12px;color:var(--muted)}
.segctl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600}
.chart svg{width:100%;height:auto;display:block}
.meal{background:var(--surface);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.meal.open{box-shadow:inset 0 0 0 1.5px var(--accent)}
.check{width:44px;height:44px;border-radius:22px;border:1.5px solid var(--faint);background:transparent;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.opts{display:grid;gap:6px}
.opts button{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.opts button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text);border-color:transparent;font-weight:600}
textarea.memo,input.txt{width:100%;border:0;border-radius:10px;background:var(--bg);padding:10px 12px;font-size:14px;resize:none}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.days button{height:52px;border-radius:12px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted)}
.days button b{font-family:var(--f-num);font-size:17px}
.days button small{font-size:11px}
.days button.has{color:var(--ink)}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.days button[disabled]{opacity:.35;cursor:default}
.setlist{background:var(--surface);border-radius:16px;display:flex;flex-direction:column}
.setlist > *{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2);font-size:15px;min-width:0}
.setlist > *:last-child{border-bottom:0}
.setlist button{border-left:0;border-right:0;border-top:0;background:transparent;text-align:left;width:100%}
.eqrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line2)}
.eqrow .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.eqrow .nm small{font-size:12px;color:var(--muted)}
.eqrow .nm small.alt{color:var(--warn)}
.yn{display:flex;background:var(--bg);border-radius:10px;padding:3px;flex:0 0 auto}
.yn button{height:32px;padding:0 12px;border-radius:8px;border:0;background:transparent;font-size:13px;color:var(--muted)}
.yn button.y[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.yn button.n[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}

.sheet-bg{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
.sheet h2{margin:0;font-size:18px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-family:var(--f-num);font-size:22px;font-weight:700}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90vw}
.sync{font-size:11px;color:var(--faint)}
.fl{stroke:var(--floor);stroke-width:2}.eq{stroke:var(--eq);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.eqt{stroke:var(--eq);stroke-width:1.6;fill:none;stroke-linecap:round}.eqf{fill:var(--eq-fill);stroke:var(--eq);stroke-width:1.6;stroke-linejoin:round}.padf{fill:var(--pad);stroke:var(--eq);stroke-width:1.4}.lim{stroke:var(--fig);stroke-linecap:round;fill:none}.far{stroke:var(--fig-far);stroke-linecap:round;fill:none}.hd{fill:var(--fig)}.hl{stroke:var(--muscle);stroke-linecap:round;fill:none;opacity:.9}.mu{fill:var(--muscle);opacity:.85}.arr{stroke:var(--accent);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-dasharray:3 3}.svgtxt{fill:var(--muted);font:500 9px var(--f-body)}
.sr{position:absolute;left:-9999px}
.tl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tl button{min-height:58px;border-radius:14px;border:1px solid #3A424D;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 4px}
.tl button b{font-size:16px}.tl button small{font-size:11px;color:var(--hero-muted);text-align:center;line-height:1.2}
.tl .tl-g[aria-pressed="true"]{background:#1F8A5B;border-color:#1F8A5B}
.tl .tl-y[aria-pressed="true"]{background:#C98A12;border-color:#C98A12}
.tl .tl-r[aria-pressed="true"]{background:#C2412D;border-color:#C2412D}
.tl button[aria-pressed="true"] small{color:#fff}
.opt{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;width:100%}
.opt b{font-size:15px}.opt span{font-size:13px;color:var(--muted)}

<script>
const PWA=true;
/* ---------- 리그: 옆에서 본 사람 (오른쪽을 봄) ---------- */
const L={torso:48,neck:7,head:9,ua:28,fa:26,th:40,sh:38,ft:12};
const R=Math.PI/180;
const dir=a=>[Math.cos(a*R),Math.sin(a*R)];
const add=(p,d,l)=>[p[0]+d[0]*l,p[1]+d[1]*l];
const rot=(d,a)=>{const c=Math.cos(a*R),s=Math.sin(a*R);return [d[0]*c-d[1]*s,d[0]*s+d[1]*c]};
const ang=(p,q)=>Math.atan2(q[1]-p[1],q[0]-p[0])/R;
function ik(a,t,l1,l2,bend){
  const dx=t[0]-a[0],dy=t[1]-a[1];let d=Math.hypot(dx,dy);
  d=Math.max(Math.abs(l1-l2)+.01,Math.min(d,l1+l2-.01));
  const base=Math.atan2(dy,dx);
  const c=(l1*l1+d*d-l2*l2)/(2*l1*d);
  const A=base+bend*Math.acos(Math.max(-1,Math.min(1,c)));
  return [a[0]+l1*Math.cos(A),a[1]+l1*Math.sin(A)];
}
function endp(m,t,l){const dx=t[0]-m[0],dy=t[1]-m[1],d=Math.hypot(dx,dy)||1;return [m[0]+dx/d*l,m[1]+dy/d*l]}
const lerp=(a,b,u)=>a+(b-a)*u;
function blend(A,B,u){const o={};for(const k in A){const a=A[k],b=(B&&k in B)?B[k]:a;
  if(Array.isArray(a))o[k]=[lerp(a[0],b[0],u),lerp(a[1],b[1],u)];else if(typeof a==="number")o[k]=lerp(a,b,u);else o[k]=a}return o}
function solve(p){
  const j={};j.hip=p.hip;const d=dir(p.torso);j.td=d;j.sh=add(p.hip,d,L.torso);j.neck=add(j.sh,d,L.neck);
  j.head=add(j.neck,dir(p.torso+(p.hd||0)),L.head);
  if(p.hand){j.el=ik(j.sh,p.hand,L.ua,L.fa,p.eb||1);j.hand=endp(j.el,p.hand,L.fa)}
  if(p.foot){j.knee=ik(p.hip,p.foot,L.th,L.sh,p.kb||-1);j.ankle=endp(j.knee,p.foot,L.sh);j.toe=add(j.ankle,dir(p.ftA??20),L.ft)}
  if(p.fHand){j.fel=ik(j.sh,p.fHand,L.ua,L.fa,p.feb??p.eb??1);j.fhand=endp(j.fel,p.fHand,L.fa)}
  if(p.fFoot){j.fknee=ik(p.hip,p.fFoot,L.th,L.sh,p.fkb??p.kb??-1);j.fankle=endp(j.fknee,p.fFoot,L.sh);j.ftoe=add(j.fankle,dir(p.fftA??p.ftA??20),L.ft)}
  return j;
}
const f=n=>n.toFixed(1);
const ln=(a,b,c,w)=>`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" class="${c}" stroke-width="${w}"/>`;
const ci=(p,r,c)=>`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${r}" class="${c}"/>`;

function drawAtt(a,j,ex){
  const P=k=>j[k];
  switch(a.t){
    case"bar":{const p=P(a.at);return ci(p,10,"eqf")+ci(p,2.6,"hd")}
    case"db":{const p=P(a.at);return ci(p,6,"eqf")+ci(p,1.8,"hd")}
    case"cable":{const p=P(a.at);return ln(a.from,p,"eqt",1.6)+ci(a.from,3,"eqf")+(a.rope?ln(p,[p[0]+2,p[1]+7],"eq",3):ci(p,3,"eqf"))}
    case"lever":{const p=P(a.at);return ln(a.from,p,"eq",4)+ci(a.from,4,"eqf")+ci(p,3.5,"eqf")}
    case"plate":{const an=j.ankle;const c=add(add(an,dir(a.u),a.du||5),dir(a.n),a.dn||3);const h=(a.len||40)/2;
      return ln(add(c,dir(a.u),-h),add(c,dir(a.u),h),"eq",5)}
    case"pad":{const jt=P(a.at);const segd={ankle:()=>dir(ang(j.knee,j.ankle)),fankle:()=>dir(ang(j.fknee,j.fankle)),knee:()=>dir(ang(j.hip,j.knee)),sh:()=>j.td,hip:()=>j.td}[a.at]();
      const p=add(jt,rot(segd,a.side||90),a.d??7);return ci(p,a.r||6,"padf")}
    case"backpad":{const s=ex.fs||1;const n=rot(j.td,-90*s);const o=a.d||8;
      const p1=add(add(j.hip,j.td,a.from??-6),n,o),p2=add(add(j.hip,j.td,a.to??52),n,o);return ln(p1,p2,"eqf",9)+ln(p1,p2,"padf",6)}
    case"knee":{const k=j.knee;return `<rect x="${f(k[0]-12)}" y="${f(k[1]+4)}" width="26" height="7" rx="3" class="padf"/>`+ln([k[0]+1,k[1]+11],[k[0]+1,190],"eqt",1.6)}
    case"crank":{let s="";for(const k of["fankle","ankle"]){const p=j[k];s+=ln(a.c,p,k==="ankle"?"eq":"eqt",k==="ankle"?3:2)+`<rect x="${f(p[0]-5)}" y="${f(p[1]+1)}" width="12" height="3" rx="1" class="eqf"/>`}return s+ci(a.c,4,"eqf")}
  }
  return"";
}
function drawFig(ex,p){
  const j=solve(p);let s=ex.bg||"";
  for(const a of(ex.att||[]))if(a.back)s+=drawAtt(a,j,ex);
  if(j.fknee)s+=ln(p.hip,j.fknee,"far",9)+ln(j.fknee,j.fankle,"far",7)+ln(j.fankle,j.ftoe,"far",4.5);
  if(j.fel)s+=ln(j.sh,j.fel,"far",7)+ln(j.fel,j.fhand,"far",5.5)+ci(j.fhand,3,"hd").replace('class="hd"','style="fill:var(--fig-far)"');
  for(const a of(ex.att||[]))if(a.mid)s+=drawAtt(a,j,ex);
  if(j.knee)s+=ln(p.hip,j.knee,"lim",10)+ln(j.knee,j.ankle,"lim",8)+ln(j.ankle,j.toe,"lim",5);
  s+=ln(j.hip,j.sh,"lim",12)+ln(j.sh,j.neck,"lim",6)+ci(j.head,9,"hd");
  const hl=ex.hl||[];const fs=ex.fs||1;
  const seg={torso:[j.hip,j.sh,6],th:[p.hip,j.knee,5],sh:[j.knee,j.ankle,4],ua:[j.sh,j.el,4.5],fa:[j.el,j.hand,3.5]};
  for(const h of hl){if(h==="back"||h==="chest"){const n=rot(j.td,(h==="chest"?90:-90)*fs);
      s+=ln(add(add(j.hip,j.td,16),n,4),add(add(j.hip,j.td,44),n,4),"hl",5)}
    else if(seg[h]&&h!=="ua"&&h!=="fa"){const[a,b,w]=seg[h];s+=ln(lp(a,b,.18),lp(a,b,.82),"hl",w)}}
  if(j.el)s+=ln(j.sh,j.el,"lim",8)+ln(j.el,j.hand,"lim",6.5)+ci(j.hand,3.4,"hd");
  for(const h of hl)if(h==="ua"||h==="fa"){const[a,b,w]=seg[h];s+=ln(lp(a,b,.15),lp(a,b,.85),"hl",w)}
  for(const a of(ex.att||[]))if(!a.back&&!a.mid)s+=drawAtt(a,j,ex);
  return s;
}
function lp(a,b,u){return[lerp(a[0],b[0],u),lerp(a[1],b[1],u)]}

/* ---------- 장면 소품 ---------- */
const floor=(y=186)=>`<line x1="4" y1="${y}" x2="236" y2="${y}" class="fl"/>`;
const rect=(x,y,w,h,rx=3,c="eqf")=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" class="${c}"/>`;
const L2=(x1,y1,x2,y2,c="eq")=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}"/>`;
const txt=(x,y,s,anchor="middle")=>`<text x="${x}" y="${y}" text-anchor="${anchor}" class="svgtxt">${s}</text>`;
const flatBench=(x1,x2,y=150)=>rect(x1,y,x2-x1,8,3)+L2(x1+10,y+8,x1+10,186)+L2(x2-10,y+8,x2-10,186);
const seat=(x1,x2,y,backTopX,backTopY)=>rect(x1,y,x2-x1,8,3)+L2((x1+x2)/2,y+8,(x1+x2)/2,186)+`<line x1="${x1+3}" y1="${y}" x2="${backTopX}" y2="${backTopY}" class="eqf" stroke-width="9" stroke-linecap="round"/><line x1="${x1+3}" y1="${y}" x2="${backTopX}" y2="${backTopY}" class="padf" stroke-width="6" stroke-linecap="round"/>`;

/* 위에서 본 그림 (모으기/벌리기 운동용) */
function topLegs(u){ // 힙 어덕션: 위에서 본 모습
  const a=lerp(30,4,u);let s=rect(70,40,100,40,10)+txt(120,22,"위에서 본 모습");
  s+=`<ellipse cx="120" cy="58" rx="30" ry="14" class="hd" style="opacity:.25"/>`;
  for(const sg of[-1,1]){const hip=[120+sg*14,62];const d=dir(90-sg*a);const knee=add(hip,d,64),foot=add(knee,d,8);
    s+=ln(hip,knee,"lim",15)+ln(lp(hip,knee,.25),lp(hip,knee,.8),"hl",7);
    const pd=add(knee,rot(d,sg*90),-12);s+=`<rect x="${f(pd[0]-6)}" y="${f(pd[1]-14)}" width="12" height="28" rx="4" class="padf" transform="rotate(${f(-sg*a)} ${f(pd[0])} ${f(pd[1])})"/>`;
    s+=ci(foot,7,"hd")}
  s+=ci([120,52],10,"hd");
  return s+`<path d="M 92 172 Q 120 182 148 172" class="arr"/>`+txt(120,195,"무릎 안쪽 패드를 모은다");
}
function topRear(u,dbmode){ // 리버스 펙덱 / 리어델트: 위에서 본 모습
  const a=lerp(8,84,u);let s=txt(120,16,"위에서 본 모습 (앞쪽이 아래)");
  if(!dbmode)s+=rect(98,96,44,10,4,"padf");else s+=rect(96,40,48,80,8,"padf");
  for(const sg of[-1,1]){const sh=[120+sg*20,84];const d=dir(90-sg*a);const el=add(sh,dir(90-sg*a*.92),30),hd=add(el,d,28);
    s+=ln(sh,el,"lim",8)+ln(el,hd,"lim",6.5);s+=ci(lp(sh,[120,84],.15),5,"mu");
    s+=dbmode?ci(hd,6,"eqf"):(ln(hd,add(hd,dir(-sg*a+90),0),"eq",4)+ci(hd,4,"eqf"))}
  s+=`<ellipse cx="120" cy="84" rx="26" ry="10" class="hd"/>`+ci([120,78],9,"hd");
  return s+`<path d="M 60 150 Q 40 120 44 92" class="arr"/><path d="M 180 150 Q 200 120 196 92" class="arr"/>`+txt(120,195,"팔을 큰 원을 그리며 옆으로 연다");
}

function sampleU(ex,t){ // 0..1 (A→B)
  if(ex.poseFn)return t/ex.period%1;
  const ph=ex.ph;const tot=ph.reduce((s,p)=>s+p[0],0);let x=t%tot;
  for(let i=0;i<ph.length;i++){const[d,lbl,m]=ph[i];if(x<=d||i===ph.length-1){const k=Math.min(1,x/d);
      const e=ex.ease==="sine"?(1-Math.cos(Math.PI*k))/2:k*k*(3-2*k);
      const u=m==="AB"?e:m==="BA"?1-e:m==="B"?1:0;return{u,i,k}}x-=d}
}
function frame(ex,t){
  if(ex.custom){const s=sampleU(ex,t);return{svg:ex.custom(s.u),ph:s}}
  if(ex.poseFn){const p=ex.poseFn(t/ex.period%1);return{svg:drawFig(ex,p),ph:{i:0,k:(t/ex.period)%1}}}
  const s=sampleU(ex,t);const p=blend(ex.A,ex.B||ex.A,s.u);return{svg:drawFig(ex,p),ph:s};
}

  if(p.k==="w"||p.k==="as"){it.w=recW(r.id);it.ws=Array(it.sets.length).fill(it.w);it.reps=p.reps}else it.reps=p.reps;return it}
function startSession(day,home){const t=today();const list=home?[{id:"warmup"},...HOME_LIST.map(id=>({id}))]:dayList(day);const s={date:t,day,status:"active",startedAt:Date.now(),cur:0,items:list.map(makeItem)};if(home)s.home=true;
  S.sessions[t]=s;for(const it of s.items)if(it.deload&&S.cfg.rec[it.id])delete S.cfg.rec[it.id].deload;S.cfg.override=null;saveCfg();save("sessions/"+t,s);return s}
function cycleNo(){const n=Object.values(S.sessions).filter(s=>s.status==="done").length;return Math.floor(n/3)+1}
function fmtW(w){return(Math.round(w*10)/10).toString()}
function roundStep(w,step){return Math.max(0,Math.round(w/step)*step)}
/* 세트 결과 기록 → 남은 세트 무게 조정 */
function recordSet(it,i,res){it.sets[i]=res;
  if(it.ws){ // 2세트 연속 실패 → 남은 세트 한 단계 내림 (운동당 1번)
    const p=PROG[it.id];if(res==="fail"&&i>0&&it.sets[i-1]==="fail"&&!it.dropped){it.dropped=true;
      for(let j=i+1;j<it.ws.length;j++)it.ws[j]=p.k==="as"?it.ws[j]+p.step:Math.max(p.step,it.ws[j]-p.step)}}}
/* 운동 끝 → 다음 추천 */
/* 다음 추천: 성공 + 허리 초록 2번 연속 → 올림 / 노랑 → 동결(2번이면 디로드) / 빨강 → 15% 내림 / 근력 실패 2번 → 10% 내림(식단 첫 2주 제외) */
function stepUp(p,w){return p.k==="as"?Math.max(0,w-p.step):w+p.step}
function stepDown(p,w,f){return p.k==="as"?roundStep(w*(1+f),p.step):Math.max(p.step,roundStep(w*(1-f),p.step))}
function inDiet(d){return daysBetween(S.cfg.dietStart||S.cfg.start,d)<14}
function applyRec(s){for(const it of s.items){if(it.kind!=="w"&&it.kind!=="as")continue;if(it.sets.some(x=>x===null))continue;
  const p=PROG[it.id];const r=Object.assign({green:0,yellow:0,sfail:0},S.cfg.rec[it.id]||{});const base=it.w;
  const pain=it.pain||"g";const fails=it.sets.filter(x=>x==="fail").length;const why=it.why||{};
  let w=base,note="keep";
  if(pain==="r"||it.sets.includes("stop")){w=stepDown(p,base,.15);note="down";r.green=0;r.yellow=0;r.sfail=0}
  else if(pain==="y"){r.yellow++;r.green=0;note="hold";if(r.yellow>=2){r.deload=true;r.yellow=0;note="deload"}}
  else if(fails===0){r.yellow=0;r.sfail=0;r.green++;if(r.green>=2){w=stepUp(p,base);note="up";r.green=0}else note="almost"}
  else{r.green=0;r.yellow=0;if((why.str||0)>0&&!inDiet(s.date)){r.sfail++;if(r.sfail>=2){w=stepDown(p,base,.1);note="down";r.sfail=0}}}
  Object.assign(r,{w,base,last:s.date,note});S.cfg.rec[it.id]=r;it.next=w;it.nextNote=note}
  for(const it of s.items)if(it.kind==="cardio"&&it.done){const c=S.cfg.cardio;
    if(it.pain==="g"){c.ok=(c.ok||0)+1;if(c.ok>=2){const mx=inDiet(s.date)?0:STAGES.length-1;c.stage=Math.min(mx,(c.stage||0)+1);c.ok=0}}
    else if(it.pain==="r"){c.stage=Math.max(0,(c.stage||0)-1);c.ok=0}else c.ok=0}
  saveCfg()}
function morningCheck(s,v){s.morning=v;if(v!=="g")for(const it of s.items||[]){const r=S.cfg.rec[it.id];if(!r||r.last!==s.date)continue;const p=PROG[it.id];
    if(r.note==="up"||r.note==="almost"){r.w=r.base;r.note="hold";r.green=0}if(v==="r"){r.w=stepDown(p,r.base,.1);r.note="down"}}
  saveCfg();save("sessions/"+s.date,s)}
function redCount7(){const t=today();let n=0;for(const k in S.sessions){if(daysBetween(k,t)>6||daysBetween(k,t)<0)continue;const s=S.sessions[k];if(s.morning==="r")n++;for(const it of s.items||[])if(it.pain==="r")n++}return n}
function itemDone(it){return it.kind==="cardio"||it.kind==="warmup"?it.done:it.sets.every(x=>x!==null)}
function exName(it){if(it.kind==="warmup")return"워밍업";return it.id==="cardio"?(it.pick==="bike"?"실내 자전거":"인클라인 걷기 / 달리기"):EX[it.id].name}
function itemMeta(it){if(it.kind==="warmup")return"5~8분";if(it.kind==="cardio")return STAGES[it.stage].m+"분";const p=PROG[it.id];
  if(it.kind==="w")return fmtW(it.w)+"kg · "+p.sets+" × "+p.reps;if(it.kind==="as")return"보조 "+fmtW(it.w)+"kg · "+p.sets+" × "+p.reps;return p.sets+" × "+p.reps}

   ${keys.length?`<section class="card"><h2>기록</h2><ul class="list">${[...keys].reverse().slice(0,10).map(k=>`<li><span class="t">${fmtMD(k)}</span><span class="m num" style="font-size:17px;color:var(--ink)">${fmtW(S.body[k].weight)} kg</span>${S.body[k].smm!=null?'<span class="chip mute">인바디</span>':""}</li>`).join("")}</ul></section>`:""}
  </main>${tabs("body")}`}
function chartSVG(pts,range){const W=326,H=150,L=30,R=320,T=16,B=126;
  if(!pts.length)return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="체중 기록 없음"><text x="${W/2}" y="${H/2}" text-anchor="middle" class="svgtxt" style="font-size:12px">아직 기록이 없어요</text></svg>`;
  const ws=pts.map(p=>p[1]);let lo=Math.floor(Math.min(...ws)-1),hi=Math.ceil(Math.max(...ws)+1);if(hi-lo<4){const m=(hi+lo)/2;lo=Math.floor(m-2);hi=Math.ceil(m+2)}
  const d0=range?addDays(today(),-range):pts[0][0];const d1=range?today():(pts.length>1?pts[pts.length-1][0]:addDays(pts[0][0],30));const span=Math.max(1,daysBetween(d0,d1));
  const x=k=>L+(R-L)*Math.max(0,Math.min(1,daysBetween(d0,k)/span)),y=w=>B-(B-T)*(w-lo)/(hi-lo);
  const ticks=[lo,Math.round((lo+hi)/2),hi];let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="체중 그래프, 최근 ${fmtW(ws[ws.length-1])}kg">`;

  if(pts.length>1){const path=pts.map((p,i)=>(i?"L":"M")+x(p[0]).toFixed(1)+" "+y(p[1]).toFixed(1)).join(" ");

 b64d(b){const bin=atob(b.replace(/\s/g,""));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)},
 localDocs(){const o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(LS)){try{o[k.slice(LS.length)]=JSON.parse(localStorage.getItem(k))}catch(e){}}}}catch(e){}return o},
 schedule(){if(!this.cfg())return;clearTimeout(this.t);this.t=setTimeout(()=>this.run(),4000)},
 async run(manual){const c=this.cfg();if(!c)return;if(this.busy){this.again=true;return}this.busy=true;this.status="동기화 중";this.paint();
  try{let r=await this.api(c,"GET");let remote={docs:{},deleted:{}},sha=null;
   if(r.status===200){const j=await r.json();sha=j.sha;remote=JSON.parse(this.b64d(j.content));remote.docs=remote.docs||{};remote.deleted=remote.deleted||{}}
   else if(r.status===401||r.status===403)throw new Error("토큰 권한을 확인해 주세요");
   else if(r.status===404){const rr=await fetch(`https://api.github.com/repos/${c.repo}`,{headers:{"Authorization":"Bearer "+c.token}});if(rr.status!==200)throw new Error("저장소를 찾을 수 없어요")}
   else throw new Error("GitHub 응답 "+r.status);
   const local=this.localDocs(),tomb=Object.assign({},remote.deleted,this.tombs());let changed=false;
   for(const k in remote.docs){const rv=remote.docs[k],lv=local[k];const rt=(rv&&rv._t)||0,lt=(lv&&lv._t)||0;if(tomb[k]&&tomb[k]>=rt)continue;
     if(!lv||rt>lt){lsSet(k,rv);local[k]=rv;changed=true}}
   for(const k in tomb){const lv=local[k];if(lv&&tomb[k]>=((lv._t)||0)){try{localStorage.removeItem(LS+k)}catch(e){}delete local[k];changed=true}}
   try{localStorage.setItem(this.tombKey,JSON.stringify(tomb))}catch(e){}
   const out={app:"more",v:1,updatedAt:new Date().toISOString(),docs:local,deleted:tomb};
   const same=JSON.stringify(remote.docs)===JSON.stringify(local)&&JSON.stringify(remote.deleted||{})===JSON.stringify(tomb);
   if(!same){const pr=await this.api(c,"PUT",{message:"sync "+new Date().toISOString().slice(0,16).replace("T"," "),content:this.b64e(JSON.stringify(out,null,1)),sha:sha||undefined});
     if(pr.status===409||pr.status===422){this.busy=false;this.again=false;return this.run(manual)}if(!pr.ok)throw new Error("올리기 실패 "+pr.status)}
   c.last=Date.now();this.setCfg(c);this.status="동기화됨";
   if(changed){loadLocal();if(!sheet)render();if(manual||!same)toast("원격 변경 사항을 반영했어요")}}
  catch(e){this.status=e.message||"동기화 실패"}
  this.busy=false;this.paint();if(this.again){this.again=false;this.schedule()}},
 paint(){const el=document.getElementById("syncst");if(el)el.textContent=this.status+(this.cfg()&&this.cfg().last?" · 마지막 "+new Date(this.cfg().last).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"")}};

const AUTH_KEY="more-auth";let unlocked=!PWA,pinBuf="",pinStage="enter",pinFirst="",pinMsg="",lockUntil=0,hiddenAt=0;

const Bio={p(){return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.BiometricAuthNative},avail:null,
 on(){try{return localStorage.getItem("more-bio")!=="0"}catch(e){return true}},
 async check(){const p=this.p();if(!p){this.avail=false;return false}try{const r=await p.checkBiometry();this.avail=!!(r&&r.isAvailable)}catch(e){this.avail=false}return this.avail},
 async auth(){const p=this.p();if(!p)return false;try{await p.internalAuthenticate({reason:"MORE 잠금 해제",cancelTitle:"PIN 입력",androidTitle:"MORE",androidSubtitle:"지문으로 잠금 해제",androidConfirmationRequired:false,allowDeviceCredential:false});return true}catch(e){return false}}};
let bioTried=false;
async function tryBio(){if(unlocked||!authGet()||pinStage!=="enter"||!Bio.on())return;if(Bio.avail===null)await Bio.check();if(!Bio.avail)return;
  if(await Bio.auth()){unlocked=true;pinMsg="";render();Sync.run();versionNotice()}}
async function hashPin(pin,salt){const d=new TextEncoder().encode(salt+":"+pin);const h=await crypto.subtle.digest("SHA-256",d);return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("")}
function vLock(){const a=authGet();if(!a&&pinStage==="enter")pinStage="new";
  const title=pinStage==="new"?"PIN 만들기":pinStage==="confirm"?"한 번 더 입력":pinStage==="change"?"현재 PIN":"MORE 잠금 해제";
  const sub=pinStage==="new"?"앱을 열 때 쓸 4자리 숫자":pinStage==="confirm"?"같은 PIN을 다시 눌러주세요":"PIN 4자리를 입력하세요";
  const keys=["1","2","3","4","5","6","7","8","9","","0","del"];
  return `<main class="lock"><span class="brand" style="font-size:28px">MORE</span><h1 style="margin:8px 0 0;font-size:20px">${title}</h1><p class="sub" style="margin:0">${sub}</p>
   <div class="dots" aria-label="${pinBuf.length}자리 입력됨">${[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?"on":""}"></i>`).join("")}</div>
   <p class="note" role="status" style="min-height:20px;margin:0;color:var(--warn)">${esc(pinMsg)}</p>
   <div class="pad">${keys.map(k=>k===""?"<span></span>":k==="del"?`<button data-pin="del" aria-label="지우기">${I.back}</button>`:`<button data-pin="${k}">${k}</button>`).join("")}</div>
   ${pinStage==="enter"&&Bio.avail&&Bio.on()?`<button class="btn ghost" data-act="bio" style="margin-top:4px">지문으로 열기</button>`:""}
   ${pinStage==="new"||pinStage==="confirm"?`<p class="note" style="text-align:center;margin:0">기록은 이 휴대폰 안에만 저장돼요. PIN을 잊으면 앱 데이터를 지워야 해서, 설정에서 백업 파일을 가끔 저장해 두세요.</p>`:""}</main>`}
async function pinPress(k){if(Date.now()<lockUntil){pinMsg="잠시 후 다시 시도하세요";render();return}
  if(k==="del"){pinBuf=pinBuf.slice(0,-1);render();return}if(pinBuf.length>=4)return;pinBuf+=k;render();if(pinBuf.length<4)return;
  const pin=pinBuf;pinBuf="";
  if(pinStage==="new"){pinFirst=pin;pinStage="confirm";pinMsg="";render();return}
  if(pinStage==="confirm"){if(pin!==pinFirst){pinStage="new";pinMsg="PIN이 달라요. 처음부터 다시";render();return}
    const salt=[...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,"0")).join("");
    try{localStorage.setItem(AUTH_KEY,JSON.stringify({salt,h:await hashPin(pin,salt),fails:0}))}catch(e){}
    pinStage="enter";pinMsg="";unlocked=true;go(S.view==="lockchange"?"settings":"home");toast("PIN을 설정했어요");try{localStorage.setItem("more-version",APP_VERSION)}catch(e){}Sync.run();return}
  const a=authGet();if(!a){pinStage="new";render();return}
  if(await hashPin(pin,a.salt)===a.h){a.fails=0;try{localStorage.setItem(AUTH_KEY,JSON.stringify(a))}catch(e){}
    if(pinStage==="change"){pinStage="new";pinMsg="새 PIN을 눌러주세요";render();return}
    unlocked=true;pinMsg="";render();Sync.run();versionNotice();return}
  a.fails=(a.fails||0)+1;try{localStorage.setItem(AUTH_KEY,JSON.stringify(a))}catch(e){}
  if(a.fails>=5){lockUntil=Date.now()+30000;pinMsg="5번 틀렸어요. 30초 뒤에 다시";a.fails=0;try{localStorage.setItem(AUTH_KEY,JSON.stringify(a))}catch(e){}}else pinMsg="PIN이 맞지 않아요 ("+a.fails+"/5)";render()}
document.addEventListener("visibilitychange",()=>{if(!PWA)return;if(document.visibilityState==="visible"&&unlocked)Sync.run();if(document.visibilityState==="visible"&&!unlocked){bioTried=true;tryBio()}if(document.visibilityState==="hidden"){hiddenAt=Date.now();if(Sync.t){clearTimeout(Sync.t);Sync.run()}}else if(hiddenAt&&Date.now()-hiddenAt>5*60000){unlocked=false;pinStage="enter";pinBuf="";render()}});

let sheetPushed=false,ignorePop=false,exitArmed=0;
function go(view,arg){const st={v:view,arg:arg??null};
  if(sheetPushed){sheetPushed=false;history.replaceState(st,"")}else history.pushState(st,"");
  S.view=view;S.arg=arg??null;sheet=null;render();window.scrollTo(0,0)}
function syncSheetHistory(){if(sheet&&!sheetPushed){sheetPushed=true;history.pushState({sheet:1},"")}
  else if(!sheet&&sheetPushed){sheetPushed=false;ignorePop=true;history.back()}}
window.addEventListener("popstate",e=>{
  if(ignorePop){ignorePop=false;return}
  if(sheetPushed){sheetPushed=false;sheet=null;render();return}
  const st=e.state||{};
  if(!unlocked){history.pushState({v:"home",guard:1},"");return}
  if(st.root){if(Date.now()-exitArmed<2000){history.back();return}
    exitArmed=Date.now();if(S.view!=="home"){S.view="home";S.arg=null;render()}history.pushState({v:"home",guard:1},"");toast("한 번 더 누르면 종료돼요");return}
  if(st.v){S.view=st.v;S.arg=st.arg??null;sheet=null;render();window.scrollTo(0,0);return}
  S.view="home";S.arg=null;render()});

const anims=[];let raf=null;const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function startAnims(){anims.length=0;document.querySelectorAll("svg[data-anim]").forEach(svg=>{const id=svg.dataset.anim;const ex=EX[id];if(!ex)return;
  const st=svg.closest("[data-stage]");anims.push({ex,g:svg.querySelector("g"),pl:st&&st.querySelector("[data-pl]"),pb:st&&st.querySelector("[data-pb]"),t:0,last:null,paused:reduce&&!st});
  const a=anims[anims.length-1];drawAnim(a)});if(!raf)raf=requestAnimationFrame(loop)}
function drawAnim(a){const{svg,ph}=frame(a.ex,a.t);a.g.innerHTML=svg;if(a.pl&&a.ex.ph[ph.i])a.pl.textContent=a.ex.ph[ph.i][1]||" ";if(a.pb)a.pb.style.width=(ph.k*100).toFixed(0)+"%"}
function loop(now){for(const a of anims){if(a.paused){a.last=null;continue}if(!a.g.isConnected)continue;a.t+=(now-(a.last||now))/1000;a.last=now;drawAnim(a)}raf=requestAnimationFrame(loop)}

const APP_VERSION="1.2.0";
const WHATS_NEW="지문으로 잠금을 풀 수 있어요 (설정 → 잠금에서 끄고 켤 수 있어요). 앱을 다시 설치하지 않아도 최신 버전이 자동으로 적용돼요.";
(function importFromHash(){if(!PWA||!location.hash.startsWith("#import="))return;
  try{const raw=decodeURIComponent(location.hash.slice(8));const bin=atob(raw);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    const data=JSON.parse(new TextDecoder().decode(u));
    for(const k in data)if(k.startsWith("more:")||k==="more-sync"||k==="more-auth"||k==="more-tomb"){if(localStorage.getItem(k)===null||k.startsWith("more:"))localStorage.setItem(k,data[k])}
    localStorage.setItem("more-imported","1")}catch(e){}
  history.replaceState(null,"",location.pathname)})();
function versionNotice(){if(!PWA)return;let last=null;try{last=localStorage.getItem("more-version");localStorage.setItem("more-version",APP_VERSION)}catch(e){}
  if(last&&last!==APP_VERSION)setTimeout(()=>{sheet=()=>`<div class="sheet-bg" data-act="close"><div class="sheet" role="dialog" aria-label="새 버전" data-stop><div class="between"><h2>새 버전 ${APP_VERSION}</h2><button class="iconbtn plain" data-act="close" aria-label="닫기">${I.x}</button></div><p style="margin:0;line-height:1.6">${esc(WHATS_NEW)}</p><button class="btn" data-act="close">확인</button></div></div>`;render()},400)}
