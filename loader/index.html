<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>MORE</title>
<style>
  html,body{height:100%;margin:0;background:#111418;color:#fff;font-family:system-ui,sans-serif}
  .c{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box;text-align:center}
  .b{font-weight:800;font-size:30px;letter-spacing:.04em;color:#5B80FF}
  p{margin:0;color:#B9C0CC;font-size:14px;line-height:1.6}
  button{margin-top:6px;height:46px;padding:0 20px;border-radius:12px;border:0;background:#fff;color:#111418;font-size:15px;font-weight:700}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="c">
  <div class="b">MORE</div>
  <p id="msg">불러오는 중</p>
  <button id="retry" hidden>다시 시도</button>
</div>
<script>
// APK 껍데기: 항상 GitHub Pages의 최신 앱을 연다.
// 처음 한 번은 이 앱(이전 버전)에 저장된 기록을 주소의 # 뒤에 담아 넘긴다. # 뒤는 서버로 전송되지 않는다.
var APP = "https://jundevcodes.github.io/more/";
function payload() {
  try {
    if (localStorage.getItem("more-migrated") === "1") return "";
    var o = {}, n = 0;
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && (k.indexOf("more:") === 0 || k === "more-sync" || k === "more-auth" || k === "more-tomb")) { o[k] = localStorage.getItem(k); n++; }
    }
    if (!n) return "";
    var bytes = new TextEncoder().encode(JSON.stringify(o)), s = "";
    for (var j = 0; j < bytes.length; j += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(j, j + 0x8000));
    return "#import=" + encodeURIComponent(btoa(s));
  } catch (e) { return ""; }
}
function open() {
  var hash = payload();
  try { if (hash) localStorage.setItem("more-migrated", "1"); } catch (e) {}
  location.replace(APP + hash);
}
document.getElementById("retry").onclick = open;
if (navigator.onLine === false) {
  // 오프라인이어도 한 번 열어본 앱은 폰에 저장돼 있어서 열린다
  open();
} else {
  open();
}
setTimeout(function () {
  document.getElementById("msg").textContent = "인터넷 연결을 확인해 주세요. 처음 한 번은 연결이 필요해요.";
  document.getElementById("retry").hidden = false;
}, 8000);
</script>
</body>
</html>
